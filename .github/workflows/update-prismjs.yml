name: Update PrismJS assets

# 每周一 01:00 UTC 自动检查，也可在 Actions 页面手动触发
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 准备 Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 读取当前内置的 PrismJS 版本
        id: current
        run: |
          v=$(node -e "const s=require('fs').readFileSync('static/prism.js','utf8');const m=s.match(/^\/\* PrismJS (\d+\.\d+\.\d+)/);process.stdout.write(m?m[1]:'')")
          echo "当前内置版本: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 安装 npm 上最新的稳定版
        id: latest
        run: |
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/prism" prismjs@latest
          dir="$RUNNER_TEMP/prism/node_modules/prismjs"
          v=$(node -p "require('$dir/package.json').version")
          echo "npm latest 版本: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: 已是最新，跳过
        if: steps.current.outputs.version == steps.latest.outputs.version
        run: echo "已是最新（${{ steps.current.outputs.version }}），无需更新"

      - name: 重建静态资产
        if: steps.current.outputs.version != steps.latest.outputs.version
        env:
          PRISM_DIR: ${{ steps.latest.outputs.dir }}
          BUMP_VERSION: '1'
        run: node build/build.js

      - name: 冒烟测试
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: node build/smoke-test.js

      - name: 提交并推送
        if: steps.current.outputs.version != steps.latest.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/ Plugin.php
          if git diff --cached --quiet; then
            echo "无改动"
          else
            git commit -m "chore: 自动升级 PrismJS 到 ${{ steps.latest.outputs.version }}"
            git push
          fi
